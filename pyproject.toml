[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "appstore-doctor"
version = "0.1.0"
description = "Diagnose why your iOS app won't ship. Read-only checks for signing, provisioning, and App Store Connect."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Brandon Kessinger" }]
keywords = ["ios", "app-store", "fastlane", "code-signing", "provisioning", "xcode", "appstoreconnect"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["cryptography>=3.4"]

[project.urls]
Homepage = "https://github.com/Bkessing/appstore-doctor"
Issues = "https://github.com/Bkessing/appstore-doctor/issues"

[project.scripts]
appstore-doctor = "appstore_doctor.__main__:main"

[tool.setuptools.packages.find]
include = ["appstore_doctor*"]
